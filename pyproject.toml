[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "periop"
version = "0.1.0"
description = "Perioperative data exercises: clinical-note extraction with a local LLM and early prediction of hypotension from arterial waveforms and patient-record variables"
authors = [{ name = "Nida Nasir" }]
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
