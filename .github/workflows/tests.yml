name: tests
on: [push, pull_request]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # the unit tests need neither the data nor the language model, so only the light packages are installed
      - run: pip install numpy pandas scipy scikit-learn pytest
      - run: pytest -q
